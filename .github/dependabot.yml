# Dependabot: avisa de dependencias vulnerables o viejas y abre el PR que las
# actualiza. Cada PR manda un correo, por eso las menores y de parche van juntas
# en un solo PR por semana; las mayores (Spring Boot incluido) van cada una por
# su lado porque son las que rompen.
#
# Las actualizaciones de seguridad (las que dispara una alerta) no dependen de
# este archivo: se encienden en Settings → Code security.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # Las pruebas con Postgres embebido deben coincidir con la base real
      # (Supabase, Postgres 17): con otra mayor probarían contra un motor distinto
      # al de producción. Se sube cuando Supabase suba.
      - dependency-name: "io.zonky.test.postgres:*"
        update-types: ["version-update:semver-major"]

  # Las imágenes base del Dockerfile (JDK y JRE) son lo que realmente corre en
  # producción: un parche de seguridad del JRE llega por aquí, no por el pom.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    commit-message:
      prefix: "deps"
    ignore:
      # La versión de Java la fija `java.version` del pom (25): subir el JDK de la
      # imagen de build sin subir el JRE de ejecución, o al revés, los desalinea.
      # Se cambian a mano y juntos, junto con el pom.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
