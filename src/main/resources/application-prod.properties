# ---------- Produccion: Postgres gestionado (Neon) ----------
# URL, usuario y contrasena llegan por variables de entorno; Spring Boot las
# mapea solo (SPRING_DATASOURCE_URL -> spring.datasource.url). NUNCA se
# escriben credenciales aqui: el repositorio es publico.
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon cierra las conexiones ociosas: pool chico y de vida corta para no
# entregar una conexion ya muerta.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.connection-timeout=30000

# El esquema lo genera Hibernate desde las entidades. En desarrollo lo crea
# schema.sql con sintaxis de H2; mantener ese archivo al dia para dos dialectos
# distintos no compensa cuando las entidades ya lo describen.
spring.jpa.hibernate.ddl-auto=update

# CLAVE: never. data.sql son INSERT fijos sin condicion, y con una base que
# persiste se volverian a insertar en CADA reinicio de Render, duplicando
# salones y eventos sin parar. En produccion siembra DatosDemo, que comprueba
# antes si la base ya tiene algo.
spring.sql.init.mode=never

spring.jpa.show-sql=false
spring.thymeleaf.cache=true
spring.h2.console.enabled=false

# El error 500 no debe filtrar trazas al visitante
server.error.include-stacktrace=never
server.error.include-message=never
