# ---------- Producción: Postgres de Supabase ----------
# URL, usuario y contraseña llegan por SPRING_DATASOURCE_URL/_USERNAME/_PASSWORD.
# Nunca se escriben aquí: el repositorio es público.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# El pooler de Supabase ya reparte conexiones; el plan gratuito admite pocas.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=280000

spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
