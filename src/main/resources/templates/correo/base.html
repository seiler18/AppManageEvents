<!DOCTYPE html>
<!--/* Marco de todos los correos. Estilos en línea a propósito: los clientes
     de correo descartan <style> y las hojas externas. Las URL son absolutas
     (urlBase) porque el correo se abre fuera del sitio. */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="marco(contenido)">
<head><meta charset="utf-8"><title th:text="${asunto}">Asunto</title></head>
<body style="margin:0;padding:0;background:#f4f2fb;font-family:Arial,Helvetica,sans-serif;color:#1f1b2e;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2fb;padding:24px 0;">
    <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr><td style="background:#5b3cc4;padding:20px 28px;">
                <a th:href="${urlBase}" style="color:#ffffff;font-size:20px;font-weight:bold;text-decoration:none;" th:text="${sitio}">Sitio</a>
            </td></tr>
            <tr><td style="padding:28px;font-size:15px;line-height:1.55;">
                <th:block th:replace="${contenido}"></th:block>
            </td></tr>
            <tr><td style="padding:16px 28px;background:#faf9fe;color:#6b6780;font-size:12px;line-height:1.5;">
                Recibes este correo porque tienes una cuenta en <span th:text="${sitio}">sitio</span>.
                <th:block th:if="${urlBaja}"><br><a th:href="${urlBaja}" style="color:#6b6780;">No quiero recibir avisos de nuevos eventos</a></th:block>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
