<!DOCTYPE html>
<!--/*
  Cinta de navegacion inferior, solo visible en el celular (<= 720px). Trae su
  propio CSS y JS para poder incluirse al final del <body> de cualquier pagina.
  Respeta la sesion con sec:authorize; el item activo lo marca nav-inferior.js.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="nav-inferior" aria-label="Secciones" th:fragment="cinta">
  <link rel="stylesheet" th:href="@{/css/nav-inferior.css}">
  <a class="nav-item" th:href="@{/}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>Inicio</span>
  </a>
  <a class="nav-item" th:href="@{/eventos}" sec:authorize="isAuthenticated()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Eventos</span>
  </a>
  <a class="nav-item" th:href="@{/nuevo}" sec:authorize="isAuthenticated()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    <span>Nuevo</span>
  </a>
  <a class="nav-item" th:href="@{/nuevoSalon}" sec:authorize="isAuthenticated()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg>
    <span>Salones</span>
  </a>
  <form class="nav-item" th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
    <button type="submit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>
      <span>Salir</span>
    </button>
  </form>
  <a class="nav-item" th:href="@{/login}" sec:authorize="!isAuthenticated()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 8l4 4-4 4M14 12H4"/></svg>
    <span>Entrar</span>
  </a>
  <a class="nav-item" th:href="@{/register}" sec:authorize="!isAuthenticated()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.6-7 8-7M18 14v6M15 17h6"/></svg>
    <span>Registrarse</span>
  </a>
  <script th:src="@{/js/nav-inferior.js}" defer></script>
</nav>
</body>
</html>
