<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: pagina(~{::title}, ~{::main}, 'admin')}">
<head><title th:text="|Órdenes · ${sitio}|">Órdenes</title></head>
<body>
<main class="container mt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Órdenes</h1>
        <form th:action="@{/admin/ordenes}" method="get" class="d-flex gap-2">
            <select class="form-select" name="estado" aria-label="Filtrar por estado">
                <option value="">Todos los estados</option>
                <option th:each="s : ${estados}" th:value="${s}" th:text="${s}" th:selected="${s == estado}">estado</option>
            </select>
            <button class="btn btn-outline-primary">Filtrar</button>
        </form>
    </div>
    <p class="small text-body-secondary">Se muestran las 200 más recientes.</p>
    <div class="table-responsive">
        <table class="table table-sm align-middle tabla-movil">
            <thead><tr><th>Fecha</th><th>Orden</th><th>Evento</th><th>Comprador</th><th>Cant.</th><th>Monto</th><th>Estado</th><th>Autorización</th><th></th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(ordenes)}"><td colspan="9" class="text-body-secondary">Sin órdenes.</td></tr>
            <tr th:each="o : ${ordenes}">
                <td class="small" th:text="${@fmt.corta(o.creadaEn)}">fecha</td>
                <td class="codigo small"><a th:href="@{/compras/{c}(c=${o.codigo})}" th:text="${o.codigo}">AME</a></td>
                <td><a th:href="@{/admin/eventos/{id}(id=${o.evento.id})}" th:text="${o.evento.titulo}">Evento</a></td>
                <td class="small" th:text="${o.usuario.email}">correo</td>
                <td th:text="${o.cantidad}">1</td>
                <td th:text="${@fmt.clp(o.monto)}">$</td>
                <td><span th:replace="~{fragmentos :: estadoOrden(${o.estado})}"></span></td>
                <td class="small" th:text="${o.codigoAutorizacion}">1234</td>
                <td>
                    <form th:if="${o.estaPagada()}" th:action="@{/admin/ordenes/{c}/reembolsar(c=${o.codigo})}" method="post"
                          th:data-confirmar="|¿Reembolsar la orden ${o.codigo} en Webpay?|">
                        <button class="btn btn-sm btn-outline-danger">Reembolsar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
