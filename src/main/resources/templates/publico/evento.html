<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: pagina(~{::title}, ~{::main}, 'publico')}">
<head><title th:text="|${evento.titulo} · ${sitio}|">Evento</title></head>
<body>
<main class="container mt-4">
    <nav aria-label="Ruta" class="small mb-3"><a th:href="@{/}"><i class="bi bi-arrow-left"></i> Cartelera</a></nav>

    <div class="row g-4">
        <div class="col-lg-8">
            <img class="hero-evento mb-4" th:if="${evento.imagenUrl}" th:src="${evento.imagenUrl}" th:alt="${evento.titulo}">
            <div class="alert alert-danger" th:if="${evento.estado.name() == 'CANCELADO'}">
                <i class="bi bi-x-octagon me-1"></i>Este evento fue cancelado.
            </div>
            <h1 class="fw-bold" th:text="${evento.titulo}">Título</h1>
            <ul class="list-unstyled text-body-secondary mb-4">
                <li class="mb-1"><i class="bi bi-calendar-event me-2"></i><span th:text="${@fmt.fecha(evento.fechaInicio)}">fecha</span></li>
                <li th:if="${evento.salon}"><i class="bi bi-geo-alt me-2"></i><strong th:text="${evento.salon.nombre}">Salón</strong>
                    <span th:if="${evento.salon.direccion}" th:text="|· ${evento.salon.direccion}|">dirección</span></li>
            </ul>
            <div class="texto-libre" th:text="${evento.descripcion}">Descripción</div>
        </div>

        <div class="col-lg-4">
            <div class="card caja-compra shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-baseline mb-3">
                        <span class="text-body-secondary">Precio por entrada</span>
                        <span class="precio fs-4" th:text="${@fmt.precio(evento.precio)}">$10.000</span>
                    </div>

                    <th:block th:if="${aLaVenta}">
                        <div th:replace="~{fragmentos :: ocupacion(${evento})}"></div>
                        <form class="mt-3" th:action="@{/eventos/{id}/comprar(id=${evento.id})}" method="post"
                              sec:authorize="isAuthenticated()">
                            <label for="cantidad" class="form-label">Cantidad</label>
                            <input type="number" class="form-control form-control-lg mb-3" id="cantidad" name="cantidad"
                                   value="1" min="1" th:max="${maxCompra}" th:data-precio="${evento.precio}" required>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span>Total</span><span class="total" id="total" th:text="${@fmt.precio(evento.precio)}">$0</span>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <th:block th:if="${evento.gratuito}"><i class="bi bi-ticket me-1"></i>Reservar entradas</th:block>
                                <th:block th:unless="${evento.gratuito}"><i class="bi bi-credit-card me-1"></i>Pagar con Webpay</th:block>
                            </button>
                            <p class="small text-body-secondary mt-2 mb-0" th:unless="${evento.gratuito}">
                                Débito, crédito o prepago. Tus entradas quedan reservadas mientras pagas.
                            </p>
                        </form>
                        <div class="mt-3" sec:authorize="!isAuthenticated()">
                            <a class="btn btn-primary btn-lg w-100" th:href="@{/login}">Ingresa para comprar</a>
                            <p class="small text-center mt-2 mb-0">¿Sin cuenta? <a th:href="@{/registro}">Créala gratis</a></p>
                        </div>
                    </th:block>

                    <div class="alert alert-secondary mb-0" th:if="${agotado}">
                        <i class="bi bi-emoji-frown me-1"></i>Entradas agotadas.
                    </div>
                    <div class="alert alert-secondary mb-0" th:if="${terminado}">Este evento ya se realizó.</div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
