<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Sin este viewport el movil renderiza la pagina a 980px y la escala:
         el formulario se veia diminuto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Evento</title>
    <link rel="shortcut icon" type="image/png" href="/img/favicon.png">
    <!--CSS de Bootstrap 4.2.1-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
        integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">
    <!--Google Fonts-->
    <link href="https://fonts.googleapis.com/css?family=Raleway:400,700" rel="stylesheet">
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
        integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <!--CSS propio-->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Antes: navbar-expand-Lg (con L mayuscula, clase que no existe, asi que
     el menu nunca se comportaba como barra) y un <li class="navbar-brand">
     con un </a> suelto sin apertura. El rotulo va en .navbar-text, que es la
     clase de Bootstrap para texto que no es enlace. -->
<nav class="navbar navbar-expand flex-wrap navbar-dark bg-dark">
    <a class="navbar-brand" href="/">Control de eventos</a>
    <span class="navbar-text text-light">Editando el evento</span>
</nav>

<br>

<div class = "container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-6 card">
         <h1 class ="text-center">Editar evento</h1>
         <div class="card-body">
            <form th:action="@{/guardar}" th:object="${evento}" method="post">

                <div class="form-group">
                    <label>Evento ID :</label>
                    <input type="text" th:field="*{id}" class="form-control" readonly>
                </div>

                <div class="form-group">
                    <label>Nombre :</label>
                    <input type="text" name ="nombre" th:field="*{nombre}" class="form-control" placeholder="Digite el nombre del evento" required>
                </div>

                <div class="form-group">
                    <label>Fecha :</label>
                    <input type="date" th:field="*{fecha}" class="form-control" placeholder="Digite la fecha del evento" required>
                </div>

                <div class="form-group">
                    <label>Invitados :</label>
                    <input type="number" th:field="*{invitados}" class="form-control" placeholder="Digite la cantidad de invitados" required>
                </div>

                <div class="form-group">
                    <label for="salon">Seleccionar Salón:</label>
                    <!-- form-control: sin ella el desplegable salia con el ancho
                         nativo del navegador, minusculo al lado de los inputs. -->
                    <select id="salon" name="salon" class="form-control">
                        <option value="">Seleccione un salón</option>
                        <option th:each="salon : ${salones}"
                                th:value="${salon.id}"
                                th:text="${salon.nombre}">Salon Nombre</option>
                    </select>
                </div>

                <div class="text-center p-3">
                    <img src="/img/Salon.png" class="img-fluid" alt="Imagen de un salon">
                </div>
                <div class="box-footer d-flex justify-content-center">
                    <button class="btn btn-success mx-2">Guardar</button>
                    <a class="btn btn-danger mx-2" href="/">Volver</a>
                </div>
                
            </form>

        </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-auto container-footer">
    <div class="container">
        <p>&copy; 2024 Control de Eventos. Todos los derechos reservados.</p>
        <ul class="list-inline">
            <li class="list-inline-item">
                <a href="/" class="text-white">Política de Privacidad</a>
            </li>
            <li class="list-inline-item">
                <a href="/" class="text-white">Términos de Servicio</a>
            </li>
            <li class="list-inline-item">
                <a href="/" class="text-white">Contacto</a>
            </li>
        </ul>
    </div>
</footer>

</body>
</html>
