spring.application.name=AppManageEvents
# Sin SPRING_PROFILES_ACTIVE se arranca en dev: H2 en memoria y datos de demo.
spring.profiles.default=dev
# Render y cualquier PaaS inyectan el puerto por PORT.
server.port=${PORT:8080}
# Detrás del proxy de Render (o de Nginx en un VPS) la app recibe http; sin
# esto las redirecciones saldrían a http:// y el login rebotaría.
server.forward-headers-strategy=framework
server.servlet.session.timeout=8h
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Aplicación ----------
app.nombre-sitio=${APP_NOMBRE_SITIO:AppManageEvents}
# URL pública absoluta: Webpay vuelve a ella y los correos la enlazan. No se
# deduce de la petición porque detrás de un proxy puede llegar mal.
app.url-base=${APP_URL_BASE:http://localhost:8080}
app.zona-horaria=America/Santiago
# Minutos que una compra pendiente retiene sus entradas. Webpay da unos pocos
# minutos para pagar; el margen cubre al que vuelve tarde del banco.
app.minutos-reserva=20
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.correo.remitente=${MAIL_FROM:no-responder@localhost}

# ---------- Base de datos (local: H2 en memoria) ----------
spring.datasource.url=jdbc:h2:mem:eventos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration,classpath:db/{vendor}

# ---------- Webpay Plus ----------
# Sin variables, ambiente de integración con el comercio de prueba público de
# Transbank: se puede pagar con las tarjetas de prueba sin contrato.
transbank.ambiente=${TRANSBANK_AMBIENTE:integracion}
transbank.codigo-comercio=${TRANSBANK_CODIGO_COMERCIO:597055555532}
transbank.api-key=${TRANSBANK_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}

# ---------- Correo ----------
# Si MAIL_HOST está vacío no se envía nada: el contenido queda en el log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

spring.thymeleaf.cache=false
spring.web.locale=es_CL
spring.web.locale-resolver=fixed

management.endpoints.web.exposure.include=health
# El chequeo de salud no mira el SMTP: si el correo cae, la plataforma no debe
# reiniciar una app que sigue vendiendo bien.
management.health.mail.enabled=false
springdoc.swagger-ui.path=/api/docs
springdoc.paths-to-match=/api/**
